name: Electron E2E

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - '.github/workflows/electron-e2e.yml'
      - 'electron/**'
      - 'scripts/e2e-*.mjs'
      - 'src/**'
      - 'index.html'
      - 'src/types/electron.d.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.mts'
      - 'vitest.config.mts'
  workflow_dispatch:
    inputs:
      size_mb:
        description: 'Generated JSON sample size in MB'
        required: false
        default: '2'
        type: string
  schedule:
    - cron: '0 21 * * 0'

permissions:
  contents: read

concurrency:
  group: electron-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  electron-e2e:
    name: Desktop JSON Flow (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact_name: linux
          - name: macOS
            os: macos-latest
            artifact_name: macos
          - name: macOS Intel
            os: macos-15-intel
            artifact_name: macos-intel
          - name: Windows
            os: windows-latest
            artifact_name: windows
    env:
      HANJSON_E2E_SIZE_MB: ${{ github.event_name == 'schedule' && '20' || github.event_name == 'workflow_dispatch' && inputs.size_mb || '2' }}
      HANJSON_E2E_ARTIFACT_DIR: electron-e2e-artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Install virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Check coverage and build on Intel Mac
        if: matrix.artifact_name == 'macos-intel'
        run: npm run check

      - name: Run Electron E2E on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run e2e:electron

      - name: Run Electron E2E on macOS or Windows
        if: runner.os != 'Linux'
        run: npm run e2e:electron

      - name: Verify invalid JSON editing on Linux
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum node scripts/e2e-electron-error-location.mjs
          xvfb-run --auto-servernum node scripts/e2e-electron-middle-error.mjs

      - name: Verify invalid JSON editing on macOS or Windows
        if: runner.os != 'Linux'
        run: |
          node scripts/e2e-electron-error-location.mjs
          node scripts/e2e-electron-middle-error.mjs

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-diagnostics-${{ matrix.artifact_name }}
          path: electron-e2e-artifacts
          if-no-files-found: ignore
